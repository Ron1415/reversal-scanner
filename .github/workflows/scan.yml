name: reversal-scan

on:
  schedule:
    # Times are UTC. Each pair covers summer (EDT) and winter (EST) time.
    # The scanner itself skips any run outside 2:45-3:59 PM New York time.
    - cron: "5 19 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "50 19 * * 1-5"
    - cron: "5 20 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "50 20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = scan every stock, quick = re-check today's list, analyze = update the trade tracker only"
        default: "full"
      check_tickers:
        description: "Optional: check tickers instead of scanning (e.g. TPR AAPL)"
        default: ""
      check_date:
        description: "Date for the check, YYYY-MM-DD (blank = today)"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: reversal-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Check tickers (results appear on this run's summary page)
        if: ${{ inputs.check_tickers }}
        env:
          TICKERS: ${{ inputs.check_tickers }}
          DAY: ${{ inputs.check_date }}
        run: |
          python scanner.py --explain --tickers $TICKERS ${DAY:+--asof $DAY}

      - name: Scan
        if: ${{ !inputs.check_tickers }}
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "analyze" ]; then
            python scanner.py --analyze
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scanner.py --refresh "${MODE:-full}"
          else
            python scanner.py --auto
          fi
          mkdir -p site
          [ -f site/index.html ] || python -c "from pathlib import Path; import report; report.write_pages(Path('.'))"

      - name: Save results
        if: ${{ !inputs.check_tickers }}
        run: |
          git config user.name "reversal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site
          if [ -d history ]; then git add -A history; fi
          git diff --cached --quiet || git commit -m "Scan $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          # trades may have been saved from the dashboard during the run
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - if: ${{ !inputs.check_tickers }}
        uses: actions/configure-pages@v5

      - if: ${{ !inputs.check_tickers }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        if: ${{ !inputs.check_tickers }}
        uses: actions/deploy-pages@v4
