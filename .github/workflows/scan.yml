name: reversal-scan

on:
  schedule:
    # Times are UTC. Each pair covers summer (EDT) and winter (EST) time.
    # The scanner itself skips any run outside 2:45-3:59 PM New York time.
    - cron: "5 19 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "50 19 * * 1-5"
    - cron: "5 20 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "50 20 * * 1-5"
    # THE BOT (paper): every 10 minutes in the morning. The bot itself only acts 9:40 AM-12:05 PM New York time.
    - cron: "*/10 13-17 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = scan every stock, quick = re-check today's list, analyze = update the trackers, backtest = replay past trading days (set the length below), bot = run the paper bot now"
        default: "full"
      backtest_days:
        description: "Backtest length in trading days (125 = about 6 months, 250 = about 1 year)"
        default: "125"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: reversal-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Scan
        env:
          MODE: ${{ github.event.inputs.mode }}
          BT_DAYS: ${{ github.event.inputs.backtest_days }}
        run: |
          if [ "$MODE" = "analyze" ]; then
            python scanner.py --analyze
          elif [ "$MODE" = "bot" ]; then
            python scanner.py --bot --force
          elif [ "$MODE" = "backtest" ]; then
            python scanner.py --backtest "${BT_DAYS:-125}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scanner.py --refresh "${MODE:-full}"
          else
            python scanner.py --bot
            python scanner.py --auto
          fi
          mkdir -p site
          [ -f site/index.html ] || python -c "from pathlib import Path; import report; report.write_pages(Path('.'))"

      - name: Save results
        run: |
          git config user.name "reversal-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in site history bot suggestions.json earnings_cache.json backtest_suggestions.json; do
            if [ -e "$f" ]; then git add -A "$f"; fi
          done
          git diff --cached --quiet || git commit -m "Scan $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          # trades may have been saved from the dashboard during the run
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
